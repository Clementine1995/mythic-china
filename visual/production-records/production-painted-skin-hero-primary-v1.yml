    prompt: |-
      Use case: stylized-concept
      Asset type: Mythic China Painted Skin Entry Hero candidate, desktop landscape
      Primary request: Create an entirely original contemporary editorial illustration for a refined cultural publication. Semi-painterly digital image with sculptural depth, tactile matte mineral-like surfaces, restrained atmospheric haze, precise negative space, crisp silhouettes, readable shadows, and soft directional light. Mysterious but legible; cinematic without game-poster spectacle; scholarly without becoming a diagram; tactile without decorative antiquing. No photoreal historical reconstruction. No text, letters, numerals, pseudo-Chinese writing, calligraphy, seals, talismans, symbols, logos, watermarks, borders, UI, or baked-in title. No yellowed parchment, distressed-book texture, franchise design, neon rim light, or copied historical composition.
      View an original, historically nonspecific interior from a quiet exterior darkness through one narrow rectangular window opening on the right. The act of looking through the restricted opening is the primary subject. Inside, show a mostly hidden, visually indeterminate presence whose obscured hand partly holds a simple brush, directed toward a folded, entirely unmarked skin-like material plane resting across a low surface. Keep the material ambiguous, non-anatomical, unfinished, and non-graphic. The being is tertiary and mostly occluded.
      Composition/framing: Landscape 16:9, independently designed for a 3200×1800 master. Exterior negative space dominates. Keep the leftmost 42% and top 16% calm, dark, and low-detail for white HTML title and navigation. Put the narrow rectangular reveal and ambiguous presence on the right, focal point near x 0.73, y 0.51. No border or embedded UI.
      Color palette: Smoke-green night, charcoal occlusion, warm neutral surfaces, one muted interior amber glow.
      Constraints: The brush must be visibly connected to the hidden presence, never floating. No explicit body detail. All room, window, furniture, brush, material, clothing fragment, lighting, and spatial design must be original and historically nonspecific.
      Avoid: Fox ears, fox tail, animal shadow, fixed species, glamour portrait, femme fatale, eroticized body, nudity, exposed tissue, flaying, blood, heart, organs, surgery, forced swallowing, cure scene, Taoist, sword, talisman, ritual equipment, precise Qing interior, period costume, film still, jump scare, rectangular portal effects, ghosts, or game character.
