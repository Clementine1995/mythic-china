  - manifestId: asset-chinese-underworld-guide-hero-primary-v1
    usage: hero-mobile
    prompt: |-
      Initial independent composition:
      Use case: stylized-concept
      Asset type: Mythic China editorial Entry hero — independently composed mobile rendition, strict 4:5 portrait; target canvas 1600 × 2000.

      Input images:
      - Image 1: visual-language reference only. It is not an edit target. Use only its charcoal-and-oxidized-jade material world, warm blank-paper light, restrained mist, distant scale, and quiet editorial tone.
      - Create a completely new portrait composition. Do not crop, extend, rotate, stack, reframe, trace, or reconstruct the desktop image or its layout.

      Primary request:
      Create a contemplative contemporary digital editorial illustration suggesting one bounded court-and-rebirth passage through records and administrative space. This is an original visual metaphor for a reading guide, not a historical reconstruction, religious diagram, ritual guide, or universal map of Chinese beliefs about the dead.

      Scene/backdrop:
      An invented abstract interior of matte charcoal planes, oxidized-jade architectural slabs, restrained mineral texture, thin atmospheric mist, warm paper-toned light, and one distant soft reveal. The architecture must remain non-specific and newly designed, with no identifiable temple, palace, sacred structure, historical facsimile, or copied artwork.

      Subject:
      Blank, completely unmarked administrative record surfaces are the primary foreground subject. Use original sheets, edges, folds, supports, and a low table or ledge; no writing tools. Their shapes lead the eye into the passage without becoming a literal map, chart, staircase diagram, scripture, or numbered sequence.

      Composition/framing:
      - Strict 4:5 portrait composition with a fresh, near-central depth axis and a mildly elevated oblique viewpoint, clearly distinct from the wide left-weighted desktop composition.
      - Keep the entire top 16% as a calm, low-frequency charcoal-to-jade safe zone: no essential figures, symbols, record edges, architecture intersections, bright hotspots, or dense texture.
      - Keep the entire bottom 10% calm and low-frequency: no essential figures, symbols, writing, paper corners, or high-detail objects.
      - Place the main blank record surfaces in the lower half but above the bottom safe zone, with the principal visual focus near x=0.50, y=0.55.
      - From the records, create one clear upward line of sight through only two or three restrained, receding court-like spatial layers or thresholds.
      - End the passage in a small, soft warm-light reveal in the upper third, below the top 16% safe zone.
      - At most three tiny anonymous human silhouettes may appear only in the middle distance as subordinate scale cues. They must have no identifiable rank, portrait, costume claim, ritual role, weapon, throne, or dramatic gesture.
      - The records and passage remain primary; no character, ruler, deity, punishment, ritual object, or architectural monument becomes the focal subject.

      Style/medium:
      High-fidelity contemporary painterly digital editorial illustration with tactile matte surfaces, subtle paper grain, soft atmospheric depth, controlled detail, and museum-editorial restraint. Quiet, legible, source-aware, and contemplative rather than spectacular.

      Lighting/mood:
      Soft warm light moves upward through charcoal depth and oxidized-jade haze. Preserve readable shadow detail; no crushed blacks, black-red horror lighting, neon rim light, harsh theatrical spotlight, lens flare, or game-poster bloom.

      Color palette:
      Charcoal black, deep graphite, oxidized jade, desaturated mineral green, warm ivory paper, and muted amber light. No red seal or stamp.

      Text:
      None. Render absolutely no text or text-like marks anywhere.

      Constraints:
      No writing, pseudo-Chinese characters, calligraphy, numbers, seals, stamps, emblems, inscriptions, captions, logos, signatures, or watermarks.
      No brush, inkstone, pen, writing implement, talisman, scripture, ritual implement, funerary offering, altar, incense, Buddhist icon, Daoist icon, or prescribed rite.
      No Zhong Kui, King Yama, named Ten King, universal ruler, prominent deity, demon, monster, protector portrait, sword, or weapon.
      No literal ten-court map, ten gates, numbered stages, eighteen levels, flowchart, infographic, fixed universal route, or religious-instruction layout.
      No torture, punishment spectacle, gore, severed bodies, skull piles, fire pits, suffering, horror imagery, or threatening action.
      No European fantasy armor, Japanese-specific underworld imagery, franchise design, game UI, HUD, battle staging, movie-poster composition, or heroic central character.
      No direct copy of any museum object, historical painting, document, figure, throne, costume, ornament, punishment scene, or complete composition.
      Avoid anatomical errors, duplicated figures, malformed hands, floating paper, impossible perspective, accidental faces in textures, and high-frequency clutter.

      Targeted passage correction:
      Use case: precise-object-edit
      Asset type: Mythic China editorial Entry hero — mobile 4:5 candidate
      Input images: Image 1 is the edit target.

      Primary request:
      Change only the receding architectural passage. Remove the chain of repeated concentric rectangular doorways and replace it with exactly three visually distinct, broad, restrained court-like spatial layers: (1) the foreground record room, (2) one middle-distance raised threshold or administrative ledge, and (3) one distant opening with soft warm light. Make the three layers mildly offset and spatially varied, not a perfectly symmetrical tunnel, flowchart, map, staircase diagram, or sequence of gates.

      Preserve unchanged:
      - strict 4:5 portrait canvas and all current framing
      - the entire top 16% calm, dark, low-frequency safe zone
      - the entire bottom 10% calm, dark, low-frequency safe zone
      - blank, completely unmarked record surfaces in the lower half above the bottom safe zone
      - charcoal, graphite, oxidized-jade, warm ivory paper and muted amber palette
      - matte mineral texture, restrained mist, readable shadow detail and quiet editorial tone
      - small distant warm reveal below the top safe zone
      - at most three tiny anonymous middle-distance silhouettes as subordinate scale cues
      - no writing tools
      - no text, pseudo-Chinese marks, calligraphy, numbers, seals, stamps, emblems, inscriptions, captions, logos, signatures, or watermarks
      - no ritual objects, religious icons, rulers, deities, demons, weapons, punishments, horror, gore, ten-court map, eighteen levels, game UI, HUD, battle staging, franchise design, historical facsimile, or museum-object copying

      Do not add new objects, characters, symbols, architecture styles, props, bright hotspots, red accents, or high-frequency detail. Keep the records and passage primary. Preserve blank paper surfaces without lines or text-like stains.
