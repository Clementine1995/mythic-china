  - manifestId: asset-zhong-kui-lead-primary-v1
    usage: article-lead
    prompt: |-
      Use case: art-direction-reference / independent recomposition.
      Image 1 is a project-original Zhong Kui art-direction anchor. Use it only as an identity and visual-language reference. Create a completely new, independently composed illustration on a new canvas. Do not crop, stretch, mirror, extend, trace, or reuse the anchor's pose, camera framing, silhouette placement, or pixel layout. Preserve only the same original character identity: face, beard silhouette, hair, robe family, fully sheathed-sword design, charcoal / oxidized-jade / restrained-cinnabar palette, controlled brush-like edge language, tactile mineral haze, and the same restrained hornless subordinate-demon design family. The anchor is not historical evidence and must not be made to look like a museum original.
      Create a quiet contemporary museum-editorial 3:2 article-lead illustration composed for a final 2400 × 1600 canvas, at the highest native resolution available. This is a closer, calm scholarly portrait of Zhong Kui as a protective demon-queller: imposing, bearded, robe-wearing and scholar-like, uncanny but protective rather than horrific. Use a fresh seated or standing three-quarter pose and a different invented abstract threshold geometry from the anchor. Face and anatomically correct hands are the first priority. Make the fully sheathed sword and scabbard clearly legible without implying a fixed magical function. Focal point approximately x 0.44 / y 0.46. Keep one or two small hornless nonhuman demon attendants secondary and low in the composition, never worshipping and never equal. Keep edge details expendable for narrower responsive crops. Preserve tactile mineral haze and controlled negative space, but do not leave the subject tiny. No rendered text.
      Evidence boundaries: protective demon-queller, bearded robed commanding figure, sheathed sword, and subordinate demon retinue are supported choices. The exact face, body, expression, pose, robe details, sword fittings, threshold, light, mist, and every demon's anatomy are original inventions. The threshold and ink-and-color rhythm are contemporary editorial inference, not historical reconstruction. The minor demons have no names, ranks, species, ritual meanings, or fixed number.
      Hard exclusions: Do not copy or closely echo any museum reference pose, procession, blossom, table setting, offering arrangement, carving outline, inscription, seal, animal grouping, or complete composition. No Black Myth or other franchise likeness, game-poster camera language, entertainment silhouette, logo, trademark, HUD, neon rim light, bloom, black-red interface, or protected character design. Do not portray Zhong Kui as one of the Ten Kings, ruler of the underworld, or a fixed bureaucratic officeholder. No claim of exact Tang dress, canonical official robe, fixed sword type, magical sword function, or historically exact underworld architecture. No five bats, Five Pestilences symbolism, peach, talisman, ritual seal, pseudo-Chinese characters, invented scripture, watermark, Japanese-specific festival motifs, Japanese or European fantasy armor, horned-devil defaults, gore, torture, skull piles, labeled demon species, extra limbs, malformed hands, duplicate weapons, or fused anatomy. The subordinate demons must not look like ordinary human petitioners, worshippers, children, European devils, Japanese oni, zombies, or franchise monsters.
