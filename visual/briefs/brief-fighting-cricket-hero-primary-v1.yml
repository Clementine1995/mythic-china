notes: >-
  On 2026-09-07, the Project owner explicitly delegated review and confirmation of this English brief to Codex. Codex reviewed its evidence mapping, cultural and child-safety boundaries, rights limits, responsive composition, and exclusions and approved the direction on that delegated basis. This approval covers only the brief; it approves neither an image nor a production method. The Hero avoids depicting the child's injury, the family's burial preparations, or a literal soul transformation.
primaryReferenceFamily: The 1766 Qingketing Fighting Cricket textual witness, translated into an original compressed path from distant authority to one household and one very small cricket
period: The named textual witness was printed in 1766; although the tale opens in the Xuande era, the proposed scene does not claim to reconstruct Ming court, tax, village, or domestic history
region: Chinese literary narrative anchored to a named Shanghai Library witness; no real court, district, village, or household is reconstructed
medium: Contemporary digital editorial illustration using compressed thresholds, scale, and negative space; not a historical record painting, animal-fighting scene, or text-page facsimile
culturalContext:
  - Show how a demand passes through layers of authority and becomes pressure inside a household without presenting the tale as evidence for a general historical tax system.
  - Keep the cricket visually small and vulnerable rather than turning it into a fighter, mascot, supernatural pet, or spectacle.
  - Treat the well and the son's later account as bounded narrative details; do not depict a fall, death, resurrection, medical diagnosis, soul departure, or proven reincarnation.
  - Keep the child's body outside the image and use spatial absence rather than harm as the emotional register.
