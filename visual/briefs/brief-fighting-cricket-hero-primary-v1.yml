visualElements:
  verified:
    - elementId: demand-reaches-household
      statement: In the cited Qingketing witness, a court demand for fighting crickets passes through local authority until it reaches Chengming and his household.
      claimIds:
        - claim-fighting-cricket-levy-pressure
    - elementId: child-found-in-well-with-faint-breathing
      statement: In the cited witness, the son injures the escaped cricket, is later found in a well, and is discovered to have faint breathing while the family prepares for burial.
      claimIds:
        - claim-fighting-cricket-son-rescue-state
    - elementId: sons-later-form-account
      statement: In the cited witness, more than a year later the son says that he had taken the form of the cricket and had only just awakened.
      claimIds:
        - claim-fighting-cricket-son-shen-hua
  inferred:
    - elementId: narrowing-authority-thresholds
      statement: Use a descending chain of increasingly narrow thresholds to connect distant authority with a household edge.
      rationale: Spatial compression translates the sourced movement of pressure while avoiding invented officials, documents, institutions, or a claim of general historical practice.
    - elementId: separated-cricket-and-well-cues
      statement: Keep one small cricket in the foreground and only an incomplete circular rim in a separate depth, with the child absent.
      rationale: The separation acknowledges bounded narrative details without illustrating a fall, injury, death, resurrection, or literal transfer between bodies.
    - elementId: smoke-green-low-amber-palette
      statement: Use smoke-green depth, charcoal thresholds, warm neutral ground, and a low restrained amber highlight around the cricket.
      rationale: This proposed Liaozhai palette is an editorial choice rather than evidence for historical architecture, light, or insect coloration.
  invented:
    - elementId: original-threshold-household-space
      statement: All gates, corridors, walls, household edges, circular-rim geometry, and spatial relationships are newly designed and historically nonspecific.
    - elementId: original-cricket-depiction
      statement: The cricket's exact species, proportions, position, markings, and behavior are invented and carry no zoological or supernatural claim.
    - elementId: original-light-shadow-and-weather
      statement: All shadows, haze, surface texture, distance compression, and directional light are invented editorial devices.
