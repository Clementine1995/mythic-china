composition:
  continuity: Desktop and mobile share the same narrowing pressure path, small cricket, separated circular-rim cue, palette, and negative-space discipline while using independently authored compositions.
  hierarchy: The small cricket and path of pressure are primary together; household edge and partial rim are secondary; distant authority remains abstract; no child, ruler, official, burial, or fight appears.
  colorDirection: Smoke green and charcoal dominate, warm neutral ground protects legibility, and a restrained amber highlight identifies the cricket without making it magical.
  lightingDirection: Compress light gradually from distant elevated shadow toward the small foreground subject; avoid imperial gold spectacle, spotlighted animal combat, supernatural glow, horror lighting, and crushed detail.
  textPolicy: Entry title, historical labels, Chinese terms, pinyin, caption, credit, disclosure, and all navigation remain HTML; artwork contains no edicts, writing, pseudo-Chinese marks, seals, talismans, logos, or watermarks.
excludedMotifs:
  - Presenting the tale as proof of a general Ming tax system, court procedure, village practice, or documentary history
  - A fall into the well, a dead or injured child, a corpse, burial scene, resurrection, coma, diagnosis, or medicalized imagery
  - A departing soul, literal reincarnation, body swap, transparent transformation, or any certainty beyond the son's reported account
  - Cricket fighting, cockfighting, injured animals, gambling spectacle, arena framing, or triumphal combat
  - An emperor portrait, named official, fixed Ming costume, imperial architecture, edict, tax register, official seal, or court reconstruction
  - A glowing magical pet, cute mascot, giant monster cricket, game combatant, HUD, film character, logo, or trademark
  - Readable Chinese, fake calligraphy, title slips, seals, talismans, baked-in title text, logos, or watermarks
  - Direct copies or close derivatives of the Qingketing scan, including text, page frames, folds, damage, and complete composition
openDecisions:
  - A separately authorized production method, tool and account, input-rights review, candidate count, master location, and backup plan
  - Final image selection, content-sensitivity review, informative alt text, caption, credit, disclosure, responsive crops, and named cultural, rights, visual, accessibility, and language reviews
