visualElements:
  verified:
    - elementId: s3961-continuous-manuscript-sequence
      statement: The cited S.3961 object is an illustrated Chinese manuscript scroll dated approximately 900–1000 whose Ten Kings sequence occupies adjacent digital canvases.
      claimIds:
        - claim-ten-kings-s3961-object
    - elementId: ten-ritual-intervals
      statement: The cited CBETA witness presents seven seven-day observances followed by a hundredth-day observance, a first-anniversary observance, and a tenth observance in the third year.
      claimIds:
        - claim-ten-kings-ten-intervals
    - elementId: separated-recording-apparatus
      statement: The cited CBETA witness distinguishes a submitted declaration and registered name from a later judgment passage with a karma ledger, scale, and mirror.
      claimIds:
        - claim-ten-kings-recording-apparatus
  inferred:
    - elementId: seven-plus-three-pause-rhythm
      statement: Translate the ten textual intervals into seven compact and three more widely spaced unnumbered pauses rather than literal dated labels.
      rationale: The grouping preserves the sequence supported by the Claim while avoiding fabricated writing or a claim that S.3961 depicts this exact layout.
    - elementId: layered-record-scale-mirror-depth
      statement: Place blank record planes in one depth and abstract balance and reflection cues in another.
      rationale: Spatial separation prevents two CBETA passages from being collapsed into a single documented ritual scene.
    - elementId: charcoal-jade-cinnabar-editorial-palette
      statement: Use charcoal depth, oxidized jade haze, warm neutral light, and one restrained cinnabar navigation accent.
      rationale: This palette relates the Entry to the Chinese Underworld Collection while remaining an editorial choice rather than a claim about manuscript pigments.
  invented:
    - elementId: original-threshold-and-record-forms
      statement: All thresholds, blank record surfaces, architectural fragments, and spatial relationships are newly designed abstract forms.
    - elementId: original-balance-and-reflection-forms
      statement: The scale and mirror cues are original nonfunctional silhouettes and do not reconstruct named ritual objects.
    - elementId: original-anonymous-scale-figures
      statement: Any small figures are original, unnamed silhouettes used only for scale, with no invented rank, costume, species, or biography.
    - elementId: original-light-weather-and-texture
      statement: Directional light, haze, particles, and surface texture are invented editorial atmosphere.
