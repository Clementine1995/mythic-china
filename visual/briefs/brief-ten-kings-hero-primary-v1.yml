    organization: British Library; International Dunhuang Programme
    creator: Unidentified Chinese artist(s) and scribe(s)
    rightsStatus: research-only
    rightsUrl: https://idp.bl.uk/copyright/
    licenseOrPermissionId: null
    notes: Study only the existence of a continuous text-and-image manuscript sequence and its restrained density. Do not download, reproduce, trace, crop, upload, or imitate figures, writing, seals, individual scenes, or the complete composition.
composition:
  continuity: Desktop and mobile share one sequence, palette, material family, and separation between record and judgment layers while using independently authored compositions.
  hierarchy: The ten-part temporal rhythm is primary; blank record planes are secondary; abstract scale and mirror cues are tertiary; no king, official, punishment, or monster becomes the focal spectacle.
  colorDirection: Charcoal and oxidized jade dominate, warm neutral light holds the pauses, and cinnabar appears once as a small wayfinding accent.
  lightingDirection: Let light mark temporal pauses and increasing depth without black-red horror lighting, neon effects, game-poster bloom, or crushed shadows.
  textPolicy: Entry title, Chinese terms, pinyin, caption, credit, disclosure, and all navigation remain HTML; artwork contains no writing, numerals, pseudo-Chinese marks, scripture, seals, logos, or watermarks.
excludedMotifs:
  - Treating S.3961 and CBETA X01n0021_001 as one witness, one transcription, or one shared illustrated scene
  - Ten numbered courts, eighteen levels, a universal underworld map, or a fixed architectural itinerary
  - A supreme King Yama, a named Ten King, Zhong Kui, or invented canonical portraits and official costumes
  - Graphic punishment, torture, gore, severed bodies, skull piles, or suffering used as spectacle
  - Claims about historical display, unrolling, chanting, ritual audience, or viewing behavior not established by the current evidence
  - Direct copies or close derivatives of the IDP manuscript, including figures, writing, seals, page damage, and complete composition
  - Black Myth, entertainment-franchise silhouettes, game UI, HUD elements, logos, or trademarks
  - Pseudo-Chinese writing, invented scripture, talismans, seals, baked-in title text, or watermarks
openDecisions:
  - A separately authorized production method, tool and account, input-rights review, candidate count, master location, and backup plan
  - Final image selection, informative alt text, caption, credit, disclosure, responsive crops, and named cultural, rights, visual, accessibility, and language reviews
