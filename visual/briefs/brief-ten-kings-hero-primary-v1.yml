notes: >-
  On 2026-09-07, the Project owner explicitly delegated review and confirmation of this English brief to Codex. Codex reviewed its evidence mapping, cultural boundaries, rights limits, responsive composition, and exclusions and approved the direction on that delegated basis. This approval covers only the brief; it approves neither an image nor a production method. The IDP reference remains research-only and must not be downloaded, copied, traced, or uploaded to a generation tool.
primaryReferenceFamily: The continuous text-and-image sequence of the tenth-century Dunhuang S.3961 Ten Kings manuscript scroll, used only as a research reference for rhythm and object context
period: The primary manuscript object is dated approximately 900–1000; CBETA supplies separate textual evidence and is not treated as its transcription
region: Dunhuang in northwestern China, with the manuscript found at Mogao Cave 17; no universal Chinese underworld geography is claimed
medium: Contemporary digital editorial illustration translating sequential manuscript rhythm and record surfaces; not a scroll facsimile, historical reconstruction, or underworld map
culturalContext:
  - Keep S.3961 and CBETA X01n0021_001 visibly separate as two witnesses that support different parts of the brief.
  - Present ten ritual intervals as a temporal rhythm rather than ten numbered courts, ten portraits, or one fixed journey map.
  - Separate the declaration and name-register layer from the later karma-ledger, scale, and mirror layer; do not collapse them into one historical apparatus.
  - Keep judgment administrative and contemplative rather than punitive, gory, game-like, or horror-led.
