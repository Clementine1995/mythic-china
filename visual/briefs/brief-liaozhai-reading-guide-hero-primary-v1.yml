visualElements:
  verified:
    - elementId: staged-compilation-history
      statement: The cited scholarship places compilation approximately between 1670 and 1700 and identifies 1679 as an early point by which the main body may have taken shape.
      claimIds:
        - claim-liaozhai-compilation-period-in-luo
    - elementId: unequal-edition-groups
      statement: The cited scholarship reports different tale totals and structures for two named editions.
      claimIds:
        - claim-liaozhai-counts-vary-by-edition
  inferred:
    - elementId: layered-compilation-path
      statement: Use one partially visible lower layer and a later expanding route to suggest compilation over time without encoding exact dates in the image.
      rationale: Layering translates the reported range and 1679 milestone into an editorial reading aid without claiming a complete chronology for every tale.
    - elementId: branching-edition-paths
      statement: Divide the Hero into two unequal but connected page groups with different spatial densities and endpoints.
      rationale: The distinction communicates edition-specific variation without baking the two reported totals into the artwork as universal numbers.
    - elementId: smoke-green-night-reading-palette
      statement: Use smoke green, charcoal, warm neutral white, and a restrained pool of amber light.
      rationale: This is the proposed Liaozhai editorial family and not a claim about historical ink, paper, or reading conditions.
  invented:
    - elementId: original-unmarked-page-planes
      statement: Every page, edge, fold, binding cue, and blank surface is newly designed and contains no copied historical text or page geometry.
    - elementId: original-reading-space
      statement: The table-like planes, paths, overlaps, and surrounding space are original editorial architecture rather than a reconstructed studio or library.
    - elementId: original-light-shadow-and-texture
      statement: Night atmosphere, light pools, soft occlusion, shadow, and surface texture are invented visual devices.
