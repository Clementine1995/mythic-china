composition:
  continuity: Desktop and mobile share the same two unequal textual groups, early lower layer, palette, and material family while using independently authored compositions.
  hierarchy: The branching reading path is primary; unequal blank page groups are secondary; the earlier layer is tertiary; no supernatural figure or antique object becomes the focal subject.
  colorDirection: Smoke green and charcoal establish depth, warm neutral white defines unmarked pages, and amber light is confined to one reading junction.
  lightingDirection: Use one quiet off-axis pool of light and soft depth falloff; avoid candlelit nostalgia, sepia wash, horror underlighting, neon edges, and crushed shadows.
  textPolicy: Entry title, dates, edition names, tale totals, caption, credit, disclosure, and all navigation remain HTML; artwork contains no letters, numerals, pseudo-Chinese marks, seals, logos, or watermarks.
excludedMotifs:
  - A single definitive Liaozhai edition, one universal tale count, or a claim that every tale was completed in 1679
  - An implication that the project inspected the manuscript, Ren 2016, or Zhang 2011 text where the current evidence did not do so
  - Readable Chinese, fake calligraphy, printed numerals, edition labels, seals, title slips, logos, or watermarks
  - Full-frame yellowed paper, wormholes, distressed parchment, page-turning UI, or antique-book interface chrome
  - Generic haunted-house imagery, skulls, ghost faces, fox-woman shorthand, or horror spectacle
  - Treating zhiguai as a direct synonym for horror, mythology, or transparent folklore documentation
  - Direct copies or close derivatives of the Qingketing scan, including text, page frames, folds, damage, and complete composition
  - Film, television, game, or entertainment-franchise characters, costumes, camera compositions, logos, or trademarks
openDecisions:
  - A separately authorized production method, tool and account, input-rights review, candidate count, master location, and backup plan
  - Final image selection, informative alt text, caption, credit, disclosure, responsive crops, and named cultural, rights, visual, accessibility, and language reviews
