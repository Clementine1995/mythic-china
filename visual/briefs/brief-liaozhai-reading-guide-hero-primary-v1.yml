approvedBy: Project owner (user-delegated AI review)
approvedAt: "2026-09-07T03:02:50Z"
notes: >-
  On 2026-09-07, the Project owner explicitly delegated review and confirmation of this English brief to Codex. Codex reviewed its evidence mapping, edition boundaries, rights limits, responsive composition, and exclusions and approved the direction on that delegated basis. This approval covers only the brief; it approves neither an image nor a production method. The Qingketing scan must not be copied into the artwork or silently added to the project asset inventory.
primaryReferenceFamily: The page density, column rhythm, and page-layout spacing of the 1766 Qingketing woodblock book, translated into an edition-aware reading landscape rather than a facsimile or antique-book interface
period: The material reference is a 1766 witness; the Entry separately reports an approximate 1670–1700 compilation period and 1679 as an early main-body milestone, not a completion date for every tale
region: Chinese literary history, anchored to a named witness held by Shanghai Library; no particular studio, library room, or story location is reconstructed
medium: Contemporary digital editorial illustration using unmarked page planes and branching spatial paths; not a manuscript replica, aged-paper collage, or historical interior
culturalContext:
  - Make edition awareness the subject by showing more than one textual grouping without declaring a single definitive Liaozhai text.
  - Treat 1679 as a stage in the reported compilation history rather than the completion date of every tale.
  - Use the Qingketing object only for broad page rhythm and book-material context; do not reproduce its text, frames, folds, damage, or seals.
  - Present Liaozhai as a varied literary collection rather than a synonym for horror, mythology, fox tales, or transparent folklore evidence.
