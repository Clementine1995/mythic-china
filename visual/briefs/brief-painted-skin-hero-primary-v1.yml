visualElements:
  verified:
    - elementId: warnings-around-secret-shelter
      statement: In the cited Qingketing witness, Wang shelters a stranger in secret, dismisses his wife's concern, and later receives a Taoist's warning after an ominous aura is observed.
      claimIds:
        - claim-painted-skin-warnings-in-qingketing
    - elementId: window-view-painted-disguise
      statement: In the cited witness, Wang looks through a window and sees a being spread a human skin on a couch, paint it with a brush, put it on, and become a woman.
      claimIds:
        - claim-painted-skin-painted-disguise-in-qingketing
    - elementId: indeterminate-being-not-fox
      statement: The cited witness uses yè mèi as a rebuke and does not identify the figure as a fox within the boundaries of Painted Skin.
      claimIds:
        - claim-painted-skin-ye-mei-in-qingketing
  inferred:
    - elementId: exterior-window-viewpoint
      statement: Place the viewer outside the room and let a narrow window opening control what can be seen.
      rationale: The off-axis viewpoint translates Wang's act of looking while limiting invented details and keeping the image about uncertain perception.
    - elementId: unfinished-unmarked-appearance-plane
      statement: Show the painted skin as a blank, partly folded or suspended plane whose status remains visually ambiguous.
      rationale: A restrained material cue evokes the sourced painting and wearing actions without explicit anatomy, gore, or a copied historical image.
    - elementId: smoke-green-warm-window-palette
      statement: Use smoke-green night, charcoal occlusion, warm neutral surfaces, and one muted interior light.
      rationale: This proposed Liaozhai palette is an editorial choice and not a claim about historical pigments, architecture, or lighting.
  invented:
    - elementId: original-room-window-and-furnishing
      statement: The room, window, low surface, brush form, furnishing fragments, and all spatial relationships are newly designed and historically nonspecific.
    - elementId: original-ambiguous-presence
      statement: The partially hidden being, posture, face treatment, clothing fragments, and body proportions are original and carry no species or canonical identity.
    - elementId: original-light-shadow-and-texture
      statement: All night atmosphere, shadows, surface texture, motion, and directional light are invented editorial devices.
