notes: >-
  On 2026-09-07, the Project owner explicitly delegated review and confirmation of this English brief to Codex. Codex reviewed its evidence mapping, cultural and sensitivity boundaries, rights limits, responsive composition, and exclusions and approved the direction on that delegated basis. This approval covers only the brief; it approves neither an image nor a production method. The Hero deliberately excludes the later heart and cure sequence from its focal scene.
primaryReferenceFamily: The 1766 Qingketing Painted Skin textual witness, translated into an original off-axis threshold scene centered on looking, painting, and a wearable appearance
period: The named textual witness was printed in 1766; the proposed scene does not claim to reconstruct a precise 1766 room, costume, body, or object set
region: Chinese literary narrative anchored to a named Shanghai Library witness; no specific real location is reconstructed
medium: Contemporary digital editorial illustration using occlusion, an unmarked painted plane, and restrained body-horror tension; not a text-page facsimile, film still, or historical reconstruction
culturalContext:
  - Center the act of seeing through a window and the making of a deceptive appearance, not the later graphic attack or cure.
  - Keep the being visually indeterminate because the selected Qingketing witness does not identify it as a fox within the tale.
  - Treat the wife's warning and the Taoist's warning as narrative pressure around Wang's choices, not as permission to invent weapons, talismans, rituals, or a canonical monster design.
  - Do not turn Tso's attributed gender reading into the tale's sole meaning or use a sexualized female body as shorthand for deception.
