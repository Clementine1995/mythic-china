composition:
  continuity: Desktop and mobile share the same exterior viewpoint, narrow reveal, unmarked appearance plane, ambiguous presence, palette, and restraint while using independently authored compositions.
  hierarchy: The act of looking through the opening is primary; the brush and unmarked plane are secondary; the being remains partially hidden and tertiary; warning figures and the later cure do not appear.
  colorDirection: Smoke green and charcoal dominate, warm neutral white defines the appearance plane, and muted amber light marks the interior without glamorizing the figure.
  lightingDirection: Use a narrow off-axis interior glow against soft night occlusion; avoid beauty lighting, red-black horror lighting, jump-scare contrast, neon effects, and crushed body detail.
  textPolicy: Entry title, Chinese terms, pinyin, caption, credit, disclosure, and all navigation remain HTML; artwork contains no writing, pseudo-Chinese marks, talismans, seals, logos, or watermarks.
excludedMotifs:
  - Fox ears, fox tails, fox shadows, a fixed fox-spirit identity, or any other canonical species assignment
  - A glamorous femme fatale, eroticized nudity, voyeuristic anatomy, or a female body used as a moral symbol
  - Flaying, exposed tissue, blood, the stolen heart, open body cavities, organs, surgical imagery, forced swallowing, or the later cure as spectacle
  - A sword-wielding Taoist, invented ritual equipment, talismans, exorcism choreography, or unsupported costume detail
  - A precise Qing interior, furniture set, clothing reconstruction, or historical-date claim for the depicted story world
  - Presenting Tso's attributed gender interpretation as the only factual meaning of the tale
  - Film, television, game, or entertainment-franchise characters, costumes, camera compositions, logos, or trademarks
  - Readable Chinese, fake calligraphy, title slips, seals, baked-in title text, logos, or watermarks
  - Direct copies or close derivatives of the Qingketing scan, including text, page frames, folds, damage, and complete composition
openDecisions:
  - A separately authorized production method, tool and account, input-rights review, candidate count, master location, and backup plan
  - Final image selection, content-sensitivity review, informative alt text, caption, credit, disclosure, responsive crops, and named cultural, rights, visual, accessibility, and language reviews
