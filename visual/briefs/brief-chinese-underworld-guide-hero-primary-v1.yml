visualElements:
  verified:
    - elementId: guide-court-and-record-administration
      statement: The cited Southern Song Ten Kings scroll and modern teaching source support a court administered by a king or magistrate with scribes, officials, and records in this bounded model.
      claimIds:
        - claim-chinese-underworld-ten-magistrates-model
        - claim-chinese-underworld-song-court-painting
    - elementId: guide-transitory-passage-toward-rebirth
      statement: The cited model presents judgment as a temporary passage through courts toward rebirth rather than eternal punishment for an unchanging self.
      claimIds:
        - claim-chinese-underworld-transitory-realm
        - claim-chinese-underworld-ritual-and-rebirth
  inferred:
    - elementId: blank-record-reading-path
      statement: Use blank, unmarked record surfaces as the foreground visual entry into the Guide's sourced themes of records and judgment.
      rationale: Blank records translate the documented administrative framework into an editorial reading metaphor without inventing wording, seals, scripture, or a specific historical document format.
    - elementId: layered-nonlinear-thresholds
      statement: Arrange two or three receding spatial layers as a legible passage without numbering them or making a complete map.
      rationale: Layering supports the sourced passage model while avoiding a literal ten-court sequence or universal floor plan.
    - elementId: anonymous-court-scale-cues
      statement: Keep any official or traveler silhouettes tiny, unnamed, and subordinate to the record surfaces and route.
      rationale: The sources support court participants and judgment, but not an invented named portrait, rank system, or universal costume.
    - elementId: guide-charcoal-jade-paper-palette
      statement: Use charcoal depth, oxidized jade haze, warm paper light, and at most one restrained cinnabar wayfinding accent.
      rationale: The palette maintains the approved Collection family while the paper-toned record surfaces give the Guide its own editorial identity; it is not a claim about historical pigments.
  invented:
    - elementId: original-guide-record-surfaces
      statement: All blank record sheets, supports, edges, folds, and spatial arrangements are newly designed editorial forms rather than copies of a historical document.
    - elementId: original-guide-passage-architecture
      statement: All platforms, thresholds, walls, stairs, bridges, and spatial relationships are original abstract forms with no claim to a real temple, court, or afterlife map.
    - elementId: original-guide-anonymous-figures
      statement: Any tiny silhouettes are original, unnamed, non-portrait figures without invented ranks, species, biographies, punishments, or ritual roles.
    - elementId: original-guide-light-and-weather
      statement: Mist, directional light, mineral particles, paper glow, and depth transitions are newly designed editorial atmosphere.
referenceAssets:
  - referenceId: ref-ten-kings-hell-met-44509
    url: https://www.metmuseum.org/art/collection/search/44509
    organization: The Metropolitan Museum of Art
    creator: Jin Chushi
    rightsStatus: public-domain
    rightsUrl: https://www.metmuseum.org/policies/image-resources
    licenseOrPermissionId: cc0-1.0
    notes: Study only the existence of a king, scribe, officials, records, layered narrative density, and ink-and-color restraint. Do not upload the museum image to the generation tool or copy a figure, punishment, inscription, seal, throne, document, or complete composition.
composition:
  continuity: Desktop and mobile share one original charcoal-jade-and-paper world, blank record language, material family, and distant court scale while using independently authored compositions.
  hierarchy: Blank record surfaces and the passage are primary; tiny anonymous court or traveler silhouettes are secondary scale cues; no ruler, punishment, ritual object, demon, or deity becomes a focal subject.
  colorDirection: Charcoal and oxidized jade establish depth, warm paper light identifies the records and route, and cinnabar is optional and limited to one small non-symbolic accent.
  lightingDirection: Maintain readable dark-to-midtone title space on desktop, a soft warm route through layered haze, and one distant reveal; avoid crushed shadows, black-red horror lighting, neon rim light, and game-poster bloom.
  textPolicy: Entry title, Chinese identity, pinyin, caption, credit, disclosure, and all navigation remain HTML; artwork contains no writing, pseudo-Chinese marks, numbers, seals, logos, or watermarks.
excludedMotifs:
  - A literal map of ten courts, ten numbered gates, eighteen levels, a fixed universal route, or a diagram presented as religious fact
  - Zhong Kui, King Yama, a named Ten King, a single universal ruler, a prominent deity, or a protector portrait
  - Graphic punishment, torture, gore, severed bodies, skull piles, fire pits, horror spectacle, or suffering used as entertainment
  - Specific funerary offerings, ritual implements, talismans, scriptures, Buddhist or Daoist icons, or prescribed rites not separately sourced for the depicted context
  - Legible records, pseudo-Chinese writing, invented scripture, calligraphy, seals, official emblems, numbers, captions, logos, or watermarks
  - Direct copies of the Met object, a historical facsimile, European fantasy armor, Japanese-specific underworld iconography, franchise designs, game UI, HUD elements, or cinematic battle staging
openDecisions:
