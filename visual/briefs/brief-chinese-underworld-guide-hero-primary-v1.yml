primaryReferenceFamily: Southern Song Chinese Ten Kings court imagery and modern scholarship describing one bounded court-and-rebirth passage model
period: The primary object reference is dated before 1195; modern scholarship is used only to bound the influential popular-religious route summarized by the Guide
region: China, with the primary object linked to Mingzhou in the Southern Song period; the Guide does not claim one universal Chinese underworld map
medium: Candidate contemporary digital editorial illustration combining blank record surfaces with an original layered passage; not a historical reconstruction, ritual diagram, or facsimile
culturalContext:
  - Present the Guide as a reading path through one influential transitory court-and-rebirth model, not as a complete or timeless map of Chinese beliefs about the dead.
  - Use records, scribal administration, court hierarchy, and passage toward rebirth only as bounded structural cues supported by the cited Claim and Source records.
  - Distinguish the Guide from the Collection Hero by bringing blank record surfaces and editorial reading order into the foreground; distinguish it from the Zhong Kui Entry by omitting Zhong Kui, demons, swords, and protector portraiture.
  - Keep the atmosphere contemplative, legible, and source-aware rather than punitive, ritual-prescriptive, horror-led, or game-like.
