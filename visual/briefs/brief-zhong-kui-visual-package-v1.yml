composition:
  continuity: Keep one consistent original Zhong Kui identity, robe family, sheathed sword, and demon design language across all four logical assets while recomposing each canvas independently.
  hierarchy: Zhong Kui is always the clear primary figure; demons support the demon-queller reading without becoming a spectacle or a fixed supernatural taxonomy.
  colorDirection: Charcoal and oxidized jade dominate; restrained cinnabar marks focal accents only; warm neutral light keeps the Entry image readable on the site's shared article surface.
  lightingDirection: Use one directional reveal through haze and solid form modeling; avoid neon rim light, game-poster bloom, or a black-red HUD atmosphere.
  textPolicy: All public text, Chinese names, pinyin, titles, credits, and disclosures remain HTML or M4-generated typography; artwork contains no pseudo-Chinese writing, logo, seal, watermark, or baked-in title.
excludedMotifs:
  - Black Myth, game UI, entertainment franchise silhouettes, trademarks, logos, or copied camera compositions
  - Zhong Kui shown as one of the Ten Kings, the universal ruler of the underworld, or a fixed bureaucratic officeholder
  - Claims of reconstructing Tang dress, one canonical official robe, a fixed sword type, or a historically exact underworld building
  - Five-bat, Five-Pestilences, peach, talisman, seal, inscription, or ritual-symbol meanings not separately selected and supported by Claim
  - Japanese-specific festival iconography presented as universal Chinese evidence
  - European fantasy armor, Japanese armor, horned-devil defaults, gore, torture spectacle, skull piles, or demonic species labels
  - Pseudo-Chinese characters, invented scripture, talismans, official seals, logos, watermarks, or embedded UI text
  - Direct copies of any reference pose, composition, inscription, seal, or identifiable protected character design
openDecisions:
  - Actual production method and tool or model license
  - Exact external master storage location, backup, and logical URI mapping
  - Named cultural, rights, visual, accessibility, and language reviewers
  - M4 page typography, final safe-area verification, and generated OG or social text treatment
