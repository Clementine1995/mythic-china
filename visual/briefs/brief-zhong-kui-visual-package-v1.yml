visualElements:
  verified:
    - elementId: protective-demon-queller
      statement: Zhong Kui is presented as a demon queller in protective New Year and fifth-month contexts.
      claimIds:
        - claim-zhong-kui-demon-queller-role
        - claim-zhong-kui-protective-new-year-context
    - elementId: bearded-robed-commanding-figure
      statement: A bearded, robe-wearing Zhong Kui occupies the commanding position in an attested Yuan-period handscroll portrayal.
      claimIds:
        - claim-zhong-kui-bearded-robed-appearance
    - elementId: sheathed-sword
      statement: Zhong Kui carries a sheathed sword, without fixing a universal sword type, ornament, or supernatural function.
      claimIds:
        - claim-zhong-kui-sheathed-sword
    - elementId: subordinate-demon-retinue
      statement: Demon figures remain visibly subordinate as followers, bearers, or subdued figures rather than equal rulers.
      claimIds:
        - claim-zhong-kui-demon-retinue
  inferred:
    - elementId: threshold-guardian-composition
      statement: Place Zhong Kui at an abstract threshold to connect the protective role to the site's editorial path.
      rationale: At the Threshold is a Mythic China editorial label and spatial device, not a historical office or documented palace location.
    - elementId: late-imperial-ink-rhythm
      statement: Use controlled brush-like edges, reserved space, and asymmetrical figure grouping without imitating one historical work.
      rationale: These are editorial abstractions from the primary reference family and supporting object records, not a reconstruction of one period style.
    - elementId: charcoal-jade-cinnabar-palette
      statement: Use charcoal, oxidized jade, and restrained cinnabar accents.
      rationale: The palette comes from the approved Chinese Underworld product direction and is not asserted as the historical pigment scheme of any reference object.
    - elementId: restrained-demon-scale
      statement: Keep demon figures small, varied, and visually subordinate so the image reads as protection rather than spectacle.
      rationale: Museum records support different demon relationships, but their unified scale and behavior in this package are an editorial synthesis.
  invented:
    - elementId: original-face-and-gesture
      statement: The exact face, anatomy, expression, hand pose, and movement are newly designed for this package.
    - elementId: abstract-threshold-space
      statement: The stone-like threshold, depth layers, and nonliteral environment are a modern editorial invention, not a map of the Chinese underworld.
    - elementId: cinematic-light-and-mist
      statement: Directional light, mineral haze, and shadow transitions are invented visual devices.
    - elementId: original-demon-designs
      statement: Demon faces, bodies, colors, garments, and gestures are newly designed and carry no undocumented names, ranks, species, or fixed number.
