primaryReferenceFamily: Late-Qing Chinese ink-and-color scholarly portrayal of Zhong Kui with a sheathed sword
period: Primary reference dated 1883; Yuan-through-Qing object records provide supporting iconographic checks only
region: China
medium: Contemporary digital editorial illustration translating figure-painting rhythm into a modern museum composition, not a historical facsimile
culturalContext:
  - Present Zhong Kui as a demon-quelling and protective figure, not an underworld ruler, one of the Ten Kings, or a universal bureaucratic officeholder.
  - Treat beard, robe, sheathed sword, and demon attendants as historically attested visual choices with variation across works, not one canonical costume.
  - Separate verified museum-record evidence from editorial inference and newly invented space, light, gestures, and demon anatomy.
  - Keep the mood protective, commanding, and uncanny rather than gory, game-like, or horror-led.
