visualElements:
  verified:
    - elementId: edition-aware-unequal-text-groups
      statement: The Guide's cited scholarship reports different tale totals and structures for two named editions.
      claimIds:
        - claim-liaozhai-counts-vary-by-edition
    - elementId: painted-wearable-appearance
      statement: In the cited Painted Skin witness, a being spreads a human skin on a couch, paints it with a brush, puts it on, and becomes a woman.
      claimIds:
        - claim-painted-skin-painted-disguise-in-qingketing
    - elementId: authority-pressure-reaches-household
      statement: In the cited Fighting Cricket witness, a court demand for fighting crickets passes through local authority until it reaches Chengming and his household.
      claimIds:
        - claim-fighting-cricket-levy-pressure
  inferred:
    - elementId: three-depth-reading-path
      statement: Connect unequal page planes, an occluded brush-and-thin-layer cue, and a small cricket beneath narrowing thresholds as three depths in one reading landscape.
      rationale: The continuous path distinguishes the three member responsibilities without making their Claims interchangeable or reducing the Collection to equal story cards.
    - elementId: off-frame-strange-presence
      statement: Let shadow and occlusion imply that part of the reading world continues beyond the frame, without showing a named supernatural figure.
      rationale: Off-frame presence supports the Collection's proposed after-dark editorial atmosphere while avoiding a generic monster collage.
    - elementId: smoke-green-charcoal-amber-collection-palette
      statement: Use smoke green, charcoal, warm neutral white, and a restrained amber reading light across all three depths.
      rationale: This is the proposed Liaozhai Collection palette and not a claim about historical ink, paper, architecture, or nocturnal reading practice.
  invented:
    - elementId: original-off-axis-dark-aperture
      statement: One large off-axis dark aperture is an original enclosing silhouette designed to distinguish the Collection at small sizes; it is not a historical doorway, cave, ritual gate, or supernatural portal.
    - elementId: original-night-reading-world
      statement: The complete space, path, planes, thresholds, depth transitions, and off-frame continuation are newly designed editorial forms.
    - elementId: original-page-layer-brush-and-cricket-forms
      statement: Every page plane, suspended layer, brush, cricket, and threshold is original and does not copy a historical page, species specimen, film, game, or illustrated scene.
    - elementId: original-light-shadow-mist-and-texture
      statement: All lighting, haze, ink-like atmosphere, shadow, surface texture, and motion are invented visual devices.
