approvedAt: "2026-09-07T03:02:50Z"
notes: >-
  On 2026-09-07, the Project owner explicitly delegated review and confirmation of this English brief to Codex. Codex reviewed its member-Claim mapping, Collection differentiation, cultural boundaries, rights limits, responsive composition, and exclusions and approved the direction on that delegated basis. This approval covers only the brief; it approves neither an image nor a production method. It establishes a shared night-reading world without turning the three Entries into a character collage.
primaryReferenceFamily: The page density, column rhythm, and page-layout spacing of the 1766 Qingketing woodblock book, translated into one original smoke-green night-reading landscape with three unequal narrative depths
period: The material reference is a 1766 witness; the Collection spans an edition-aware guide and two tales and does not claim one reconstructed historical moment
region: Chinese literary tradition anchored to a named witness held by Shanghai Library; the scene does not claim to document a real studio, household, locality, or folk practice
medium: Contemporary digital editorial illustration combining unmarked page planes, occluded material transformation, and a small-scale pressure path; not a facsimile, antique-book interface, or three-panel character poster
culturalContext:
  - Present the Collection as a guided path through a varied literary work, not a universal Chinese ghost world or a transparent record of folklore.
  - Give the Guide, Painted Skin, and Fighting Cricket distinct but unequal cues within one continuous space and preserve the public reading order from guide to tales.
  - Keep the Painted Skin cue ambiguous, nonsexualized, and non-graphic; keep the Fighting Cricket cue small, nonviolent, and free of child imagery.
  - Use the Qingketing object only for broad page rhythm and book-material context; do not reproduce its text, frames, folds, damage, or seals.
