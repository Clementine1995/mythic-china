composition:
  continuity: Desktop and mobile share one large off-axis dark aperture, one reading path, three unequal depths, material family, palette, and restrained atmosphere while using independently authored compositions.
  hierarchy: The enclosing aperture and connected reading path create the primary silhouette; blank page groups establish the Guide; the brush and thin layer establish Painted Skin; the cricket and narrowing thresholds complete the path at smaller scale; no cue becomes a standalone poster.
  colorDirection: Smoke green and charcoal hold the shared world, warm neutral white defines unmarked surfaces, and one muted amber light connects the three depths.
  lightingDirection: Let a quiet off-axis light move through partial occlusion toward the small final focal point; avoid sepia nostalgia, horror underlighting, spotlighted characters, neon effects, and crushed shadows.
  textPolicy: Collection title, Chinese title, pinyin, Entry names, caption, credit, disclosure, and all navigation remain HTML; artwork contains no writing, pseudo-Chinese marks, seals, talismans, logos, or watermarks.
excludedMotifs:
  - A universal Chinese ghost world, one religious cosmology, or an unqualified documentary claim about folklore or Qing life
  - Three equal cards, triptych borders, character lineup, poster collage, floating-head composition, or a literal navigation diagram
  - A fox woman, glamorous female monster, exposed body, flaying, gore, organs, or Painted Skin as the Collection's sole identity
  - A child, well fall, corpse, burial, resurrection, soul departure, animal injury, cricket fight, cockfight, or combat spectacle
  - Full-frame yellowed paper, wormholes, distressed parchment, page-turning UI, antique-book chrome, or copied Qingketing page layouts
  - Generic ghost faces, skulls, haunted-house symbols, jump-scare lighting, or entertainment-horror shorthand
  - Film, television, game, or entertainment-franchise characters, costumes, camera compositions, UI, logos, or trademarks
  - Readable Chinese, fake calligraphy, title slips, seals, talismans, baked-in title text, logos, or watermarks
openDecisions:
  - A 640-pixel grayscale, title-free review confirming that the dominant aperture remains distinguishable from the Liaozhai Reading Guide without requiring all three narrative cues to read as miniature icons
  - A separately authorized production method, tool and account, input-rights review, candidate count, master location, and backup plan
  - Final image selection, informative alt text, caption, credit, disclosure, responsive crops, and named cultural, rights, visual, accessibility, and language reviews
