notes: Project owner selected candidate A and approved this original abstract-threshold brief for the candidate-production task on 2026-08-30. On 2026-08-31, the Project owner selected desktop candidate 02 and independently composed mobile candidate 01 for production preparation. The files remain only in the Git-ignored local explore area; composition selection does not approve publication rights, five-review results, exact-canvas masters, a production record, manifest, status promotion, Collection binding, or public use.
primaryReferenceFamily: Southern Song Chinese Ten Kings court imagery, translated into an original nonliteral threshold landscape
period: The primary object reference is dated before 1195; later popular-religious teaching is used only to bound the journey model
region: China, with the primary object linked to Mingzhou in the Southern Song period
medium: Candidate contemporary digital editorial illustration with layered ink-and-mineral atmosphere; not a historical reconstruction or facsimile
culturalContext:
  - Present one influential court-and-rebirth model without claiming a single timeless map of the Chinese underworld.
  - Use bureaucratic court hierarchy and passage toward rebirth as sourced structural cues, while keeping named kings, punishments, buildings, garments, and ritual objects out unless separately selected and supported.
  - Keep the Collection distinct from the Zhong Kui Entry; Zhong Kui is not the underworld ruler, one of the Ten Kings, or the Collection Hero subject.
  - Make the threshold contemplative and legible rather than gory, punitive, game-like, or horror-led.
targetSlots:
  - role: hero
    slotId: primary
    requiredUsages:
      - hero-desktop
      - hero-mobile
    optionalUsages: []
    canvas:
      - usage: hero-desktop
        widthPx: 3200
        heightPx: 1800
        compositionGoal: A wide descending passage moves from a quiet threshold into two or three receding court-like layers; small officials or record tables may establish hierarchy without depicting a named king or explicit punishment.
