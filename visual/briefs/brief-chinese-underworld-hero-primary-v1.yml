      - usage: hero-mobile
        widthPx: 1600
        heightPx: 2000
        compositionGoal: An independently composed vertical descent from threshold to distant court light, with one continuous reading path and no crop of the desktop scene.
        safeArea: Keep the top 24 percent and lower 12 percent free of essential figures or symbols for HTML title and responsive controls; render no text into the image.
        focalPointGoal:
          x: 0.52
          y: 0.5
        buildPlan:
          mode: responsive
