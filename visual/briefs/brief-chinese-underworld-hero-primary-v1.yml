visualElements:
  verified:
    - elementId: court-and-record-hierarchy
      statement: A king, scribe, and officials administer judgment in the cited Southern Song Ten Kings scroll, supporting a restrained court-and-record hierarchy.
      claimIds:
        - claim-chinese-underworld-song-court-painting
        - claim-chinese-underworld-ten-magistrates-model
    - elementId: judgment-to-rebirth-passage
      statement: The cited ten-magistrate model presents judgment as a transitory passage toward rebirth rather than eternal punishment.
      claimIds:
        - claim-chinese-underworld-transitory-realm
        - claim-chinese-underworld-ritual-and-rebirth
  inferred:
    - elementId: descending-threshold-path
      statement: Organize the Hero as a descending route through layered thresholds rather than a frontal throne portrait.
      rationale: A continuous path translates the sourced passage model into an editorial navigation metaphor without claiming a historical floor plan.
    - elementId: distant-court-silhouettes
      statement: Reduce court figures to small silhouettes and record-table gestures so hierarchy remains legible without inventing a named king's portrait.
      rationale: The primary object supports kings, scribes, and officials, but this candidate must not reconstruct its individual figures or costume.
    - elementId: charcoal-jade-cinnabar-palette
      statement: Use charcoal depth, oxidized jade haze, warm paper light, and a restrained cinnabar wayfinding accent.
      rationale: The palette belongs to the approved Collection design direction and is not a claim about historical pigments in the reference object.
  invented:
    - elementId: original-threshold-architecture
      statement: All gates, stairs, bridges, walls, and spatial relationships are original abstract forms with no claim to a real temple or underworld map.
    - elementId: original-light-and-weather
      statement: Mist, directional light, mineral particles, and depth transitions are newly designed editorial atmosphere.
    - elementId: original-figures
      statement: Any distant human or spirit silhouettes are original, unnamed, non-portrait figures without invented ranks, species, or biographies.
referenceAssets:
  - referenceId: ref-ten-kings-hell-met-44509
    url: https://www.metmuseum.org/art/collection/search/44509
    organization: The Metropolitan Museum of Art
    creator: Jin Chushi
    rightsStatus: public-domain
    rightsUrl: https://www.metmuseum.org/policies/image-resources
    licenseOrPermissionId: cc0-1.0
    notes: Study court hierarchy, scribe-and-official grouping, layered narrative density, and ink-and-color restraint; do not copy a king, figure, punishment, inscription, seal, throne, or complete composition.
composition:
  continuity: Desktop and mobile must share one original threshold world, palette, material family, and distant court language while using independently authored compositions.
  hierarchy: The path and depth transition are primary; court silhouettes are secondary evidence cues; no demon, punishment, deity, or ruler becomes a spectacle or franchise character.
  colorDirection: Charcoal and oxidized jade dominate, warm paper light holds the route, and cinnabar is limited to one small wayfinding accent.
  lightingDirection: Move from readable threshold light into layered depth with one distant reveal; avoid black-red horror lighting, neon rim light, game-poster bloom, and illegible crushed shadows.
  textPolicy: Collection title, Chinese title, pinyin, caption, credit, disclosure, and all navigation remain HTML; artwork contains no writing, pseudo-Chinese marks, seals, logos, or watermarks.
excludedMotifs:
  - Zhong Kui, King Yama, a named Ten King, or any figure presented as the single ruler of a universal Chinese underworld
  - Graphic torture, gore, severed bodies, skull piles, horror spectacle, or punishment used as visual entertainment
  - A literal ten-court floor plan, eighteen-level diagram, fixed gate sequence, or universal map without source-specific support
  - Black Myth, game UI, entertainment franchise silhouettes, trademarks, logos, HUD elements, or copied camera compositions
  - European fantasy armor, Japanese-specific underworld iconography presented as Chinese evidence, or generic horned-devil defaults
  - Pseudo-Chinese writing, invented scripture, talismans, official seals, watermarks, baked-in title text, or direct copies of the reference object
openDecisions:
  - Current tool terms, account authority, and publication rights for any Project owner-selected output; the candidate tool did not expose a model ID
  - Exact master storage, backup, production record, and manifest version
  - Named cultural, rights, visual, accessibility, and language reviewers
  - Final crop, contrast, caption, alt text, mobile fold, and Collection template browser review
