chosenEnglish: the underworld
firstUseGloss: yīnjiān (阴间), a broad term for the realm of the dead
alternativesRejected:
  - hell
  - Diyu
rationale: Underworld preserves the broad lexical scope and avoids making eternal punishment or one fixed court system part of every use; Diyu is a different Chinese term and is not used as an automatic synonym.
