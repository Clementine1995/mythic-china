termId: term-zhiguai-in-liaozhai-reading-guide
entryId: liaozhai-reading-guide
hanzi: 志怪
pinyin: zhìguài
sourceContext: One of several literary modes discussed by Luo Hui, print pages 157–161
chosenEnglish: zhiguai
firstUseGloss: zhiguai (志怪, zhìguài), accounts or records of anomalies
alternativesRejected:
  - horror
  - ghost stories
  - mythology
rationale: Retaining zhiguai avoids collapsing a historically situated literary mode into a modern entertainment genre or a universal body of belief.
