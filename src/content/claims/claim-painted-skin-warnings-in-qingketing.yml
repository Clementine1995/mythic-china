claimId: claim-painted-skin-warnings-in-qingketing
entryId: painted-skin
claimType: textual
evidenceContext: historical-tradition
statement: In the specified Shanghai Library Qingketing witness, Wang secretly shelters a stranger who appears to be a young woman and continues to shelter her after his wife advises him to send her away. A Taoist then sees an ominous aura around Wang and warns that death is near; Wang briefly suspects the stranger before explaining the warning away.
certainty: verified
sourceLinks:
  - sourceId: source-shanghai-library-qingketing-liaozhai-1766
    role: primary
    locator: Juan 1; Commons digital pages 72–73; visible left-side block-center folios 35–36
    note: The wife's advice is not presented as supernatural recognition. These are events in one textual witness, not direct evidence for Qing social or religious practice.
