claimId: claim-fighting-cricket-son-rescue-state
entryId: fighting-cricket
claimType: textual
evidenceContext: historical-tradition
statement: In the specified Qingketing witness, Chengming's son fatally injures the cricket while trying to catch it. The boy is later found in a well. When his family prepares to bury him, they discover faint breathing; he revives around midnight and remains vacant and unresponsive, weak and drowsy.
certainty: verified
sourceLinks:
  - sourceId: source-shanghai-library-qingketing-liaozhai-1766
    role: primary
    locator: Juan 7; Commons digital page 429; visible left-side block-center folio 6
    note: The text does not state how the boy entered the well. Its wording must not be medicalized as death, coma, or resurrection, or generalized to every textual witness.
