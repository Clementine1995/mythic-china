claimId: claim-liaozhai-compilation-period-in-luo
entryId: liaozhai-reading-guide
claimType: historical
evidenceContext: historical-tradition
statement: Luo Hui places the compilation of Liaozhai approximately between 1670 and 1700 and writes that its main body would have taken shape by as early as 1679, when Pu Songling wrote his own preface.
certainty: verified
sourceLinks:
