claimId: claim-liaozhai-compilation-period-in-luo
entryId: liaozhai-reading-guide
claimType: historical
evidenceContext: historical-tradition
statement: Luo Hui places the compilation of Liaozhai approximately between 1670 and 1700 and treats the 1679 authorial preface as evidence that a substantial collection existed by then, not that every tale was final.
certainty: verified
