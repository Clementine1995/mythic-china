claimId: claim-painted-skin-commentary-in-qingketing
entryId: painted-skin
claimType: textual
evidenceContext: historical-tradition
statement: The closing commentary introduced by Yìshǐ shì yuē rebukes mistaking what is plainly monstrous for beauty and sincerity for falsehood. It then connects coveting another's beauty with the wife's swallowing another person's spittle.
certainty: verified
